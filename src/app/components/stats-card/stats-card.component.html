<div
  class="rounded-xl p-5 transition-shadow hover:shadow-md"
  [class.bg-dark-card]="dark() && !themeDark()"
  [class.text-white]="dark() && !themeDark()"
  [class.bg-white]="dark() && themeDark()"
  [class.border]="dark() && themeDark()"
  [class.border-gray-border]="dark() && themeDark()"
  [class.text-gray-900]="dark() && themeDark()"
  [ngClass]="!dark() ? 'bg-white dark:bg-dark-lighter border border-gray-border dark:border-dark-lighter text-gray-900 dark:text-white' : ''"
>
  <p class="text-xs font-medium mb-1"
    [class.text-gray-400]="dark() && !themeDark()"
    [class.text-gray-500]="!dark() || themeDark()"
  >
    {{ label() }}
  </p>
  <p class="text-2xl font-bold tracking-tight">{{ value() }}</p>
  @if (subtitle()) {
    <p class="text-xs mt-1"
      [class.text-gray-400]="dark() && !themeDark()"
      [class.text-gray-500]="!dark() || themeDark()"
    >
      {{ subtitle() }}
    </p>
  }
  @if (trendValue()) {
    <div class="flex items-center gap-1 mt-2">
      @if (trend() === 'up') {
        <app-icon class="w-3.5 h-3.5 text-green-500" name="trend-up" />
      } @else if (trend() === 'down') {
        <app-icon class="w-3.5 h-3.5 text-red-500" name="trend-down" />
      }
      <span class="text-xs font-medium"
        [class.text-green-500]="trend() === 'up'"
        [class.text-red-500]="trend() === 'down'"
        [class.text-gray-400]="trend() === 'neutral'"
      >{{ trendValue() }}</span>
    </div>
  }
</div>
