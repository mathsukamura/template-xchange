<app-card variant="inverted" padding="md">
  <!-- Product Header -->
  <div class="flex items-start gap-4 mb-5">
    <div class="w-16 h-16 bg-dark-lighter dark:bg-gray-100 rounded-lg flex items-center justify-center flex-shrink-0">
      <app-icon class="w-8 h-8 text-lime-accent dark:text-lime-accent-hover" name="archive" />
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="font-semibold text-sm truncate">{{ name() }}</h3>
      <div class="flex items-center gap-4 mt-1">
        <span class="text-lime-accent dark:text-gray-900 font-bold text-lg">{{ price() }}</span>
        <span class="text-gray-400 dark:text-gray-500 text-sm">{{ revenue() }}</span>
      </div>
    </div>
  </div>

  <!-- Metrics Row -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="text-center">
      <p class="text-xl font-bold">{{ visitors() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Visitantes</p>
    </div>
    <div class="text-center">
      <p class="text-xl font-bold">{{ leads() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Leads</p>
    </div>
    <div class="text-center">
      <p class="text-xl font-bold">{{ sales() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Vendas</p>
    </div>
  </div>

  <!-- Conversion Metrics -->
  <div class="grid grid-cols-3 gap-3 pt-4 border-t border-dark-lighter dark:border-gray-border">
    <div class="text-center">
      <p class="text-lg font-bold text-lime-accent dark:text-gray-900">{{ conversionRate() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Conversao</p>
    </div>
    <div class="text-center">
      <p class="text-lg font-bold">{{ salesRate() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Taxa Vendas</p>
    </div>
    <div class="text-center">
      <p class="text-lg font-bold">{{ ticketMedio() }}</p>
      <p class="text-[10px] text-gray-400 dark:text-gray-500 uppercase tracking-wider">Ticket Medio</p>
    </div>
  </div>
</app-card>
