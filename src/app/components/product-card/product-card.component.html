<div class="bg-dark-card rounded-xl p-5 text-white">
  <!-- Product Header -->
  <div class="flex items-start gap-4 mb-5">
    <div class="w-16 h-16 bg-dark-lighter rounded-lg flex items-center justify-center flex-shrink-0">
      <svg class="w-8 h-8 text-lime-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m8.25 3v6.75m0 0l-3-3m3 3l3-3M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z"/>
      </svg>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="font-semibold text-sm truncate">{{ name() }}</h3>
      <div class="flex items-center gap-4 mt-1">
        <span class="text-lime-accent font-bold text-lg">{{ price() }}</span>
        <span class="text-gray-400 text-sm">{{ revenue() }}</span>
      </div>
    </div>
  </div>

  <!-- Metrics Row -->
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="text-center">
      <p class="text-xl font-bold">{{ visitors() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Visitantes</p>
    </div>
    <div class="text-center">
      <p class="text-xl font-bold">{{ leads() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Leads</p>
    </div>
    <div class="text-center">
      <p class="text-xl font-bold">{{ sales() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Vendas</p>
    </div>
  </div>

  <!-- Conversion Metrics -->
  <div class="grid grid-cols-3 gap-3 pt-4 border-t border-dark-lighter">
    <div class="text-center">
      <p class="text-lg font-bold text-lime-accent">{{ conversionRate() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Conversão</p>
    </div>
    <div class="text-center">
      <p class="text-lg font-bold">{{ salesRate() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Taxa Vendas</p>
    </div>
    <div class="text-center">
      <p class="text-lg font-bold">{{ ticketMedio() }}</p>
      <p class="text-[10px] text-gray-400 uppercase tracking-wider">Ticket Médio</p>
    </div>
  </div>
</div>
