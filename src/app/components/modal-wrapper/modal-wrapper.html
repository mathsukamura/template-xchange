@if (type() === 'modal') {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="onBackdropClick()"></div>
    <div class="relative bg-white dark:bg-dark-lighter rounded-2xl shadow-2xl w-full p-6 space-y-4 animate-in fade-in zoom-in-95 duration-200" [class]="maxWidthClass">
      @if (title()) {
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base font-bold text-gray-900 dark:text-white">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="text-[11px] text-gray-400 mt-0.5">{{ subtitle() }}</p>
            }
          </div>
          <button (click)="onClose()" class="p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer">
            <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
      <ng-content />
    </div>
  </div>
} @else {
  <!-- Drawer -->
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" (click)="onBackdropClick()"></div>
    <div class="relative bg-white dark:bg-dark-lighter w-full max-w-md h-full shadow-2xl animate-in slide-in-from-right duration-300 flex flex-col">
      @if (title()) {
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-border dark:border-dark-card">
          <div>
            <h2 class="text-base font-bold text-gray-900 dark:text-white">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="text-[11px] text-gray-400 mt-0.5">{{ subtitle() }}</p>
            }
          </div>
          <button (click)="onClose()" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer">
            <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
      <div class="flex-1 overflow-y-auto">
        <ng-content />
      </div>
    </div>
  </div>
}
