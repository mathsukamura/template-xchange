<div class="flex bg-white dark:bg-dark-card rounded-full p-1 items-center gap-0.5 shadow-sm">
  @for (tab of tabs(); track tab.route) {
    <a
      [routerLink]="tab.route"
      routerLinkActive="!bg-dark dark:!bg-lime-accent !text-white dark:!text-dark"
      class="px-3 lg:px-5 py-2 text-xs lg:text-sm font-medium text-gray-500 dark:text-gray-400 rounded-full transition-all hover:text-gray-700 dark:hover:text-gray-200 cursor-pointer whitespace-nowrap"
    >
      {{ tab.label }}
    </a>
  }

  @if (moreTabs().length) {
    @for (tab of moreTabs(); track tab.route) {
      <a
        [routerLink]="tab.route"
        routerLinkActive="!bg-dark dark:!bg-lime-accent !text-white dark:!text-dark"
        class="tab-expandable text-xs lg:text-sm font-medium text-gray-500 dark:text-gray-400 rounded-full hover:text-gray-700 dark:hover:text-gray-200 cursor-pointer whitespace-nowrap"
        [class.tab-visible]="expanded"
      >
        {{ tab.label }}
      </a>
    }

    <button
      (click)="expanded = !expanded"
      class="px-2 py-2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-full transition-colors cursor-pointer flex-shrink-0"
    >
      <app-icon class="w-4 h-4 transition-transform duration-300" [class.rotate-180]="expanded" [name]="expanded ? 'chevron-double-left' : 'dots'" />
    </button>
  }
</div>
