<div class="space-y-4 lg:space-y-6">
  <app-page-header title="Funis de vendas" subtitle="Acompanhe a performance dos seus funis">
    <button class="px-3 lg:px-4 py-2 bg-lime-accent text-dark text-xs lg:text-sm font-semibold rounded-lg hover:bg-lime-accent-hover transition-colors cursor-pointer">
      Criar novo funil
    </button>
  </app-page-header>

  <!-- Top Stats -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 lg:gap-4">
    <app-stats-card label="Total funis" value="10" />
    <app-stats-card label="Taxa conversao" value="34%" trendValue="+2,3%" trend="up" />
    <app-stats-card label="Total leads" value="23.435" trendValue="+15%" trend="up" />
    <app-stats-card label="Receita total" value="R$ 3k/k" />
  </div>

  <!-- Funnel Conversion Map -->
  <div class="bg-white dark:bg-dark-lighter rounded-xl p-4 lg:p-6">
    <h3 class="text-gray-900 dark:text-white font-semibold text-sm mb-4">Funil com maps conversao no periodo</h3>

    <!-- Conversion Flow -->
    <div class="flex items-center justify-between gap-2 mb-6">
      @for (step of ['Visitantes', 'Leads', 'Oportunidades', 'Vendas']; track step; let i = $index) {
        <div class="flex-1">
          <div class="relative">
            <div class="h-2 rounded-full" [class]="i === 0 ? 'bg-lime-accent' : i === 1 ? 'bg-lime-accent/60' : i === 2 ? 'bg-lime-accent/40' : 'bg-lime-accent/20'"></div>
          </div>
          <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-1.5 uppercase tracking-wider">{{ step }}</p>
        </div>
        @if (i < 3) {
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0 -mt-3 hidden sm:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
          </svg>
        }
      }
    </div>
  </div>

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6">
    <!-- Product Card (takes 2 cols) -->
    <div class="lg:col-span-2">
      <app-product-card />
    </div>

    <!-- Contacts Panel -->
    <div>
      <app-contacts-panel />
    </div>
  </div>
</div>

<!-- Bottom spacer for mobile dock -->
<div class="h-20 lg:hidden"></div>
