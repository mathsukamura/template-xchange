<div class="space-y-4 lg:space-y-6">
  <app-page-header title="Contatos" subtitle="Gerencie seus contatos e listas">
    <button class="px-3 lg:px-4 py-2 bg-lime-accent text-dark text-xs lg:text-sm font-semibold rounded-lg hover:bg-lime-accent-hover transition-colors cursor-pointer">
      Adicionar contato
    </button>
  </app-page-header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6">
    <!-- Contact List -->
    <div class="lg:col-span-2">
      <app-data-table [columns]="columns" [data]="recentContacts" [pageSize]="10" [showHeader]="false">
        <!-- Contato column (avatar + name + email) -->
        <ng-template appCellTemplate="name" let-row>
          <div class="flex items-center gap-3">
            <app-avatar [initials]="row.avatar" size="lg" shape="circle" variant="inverted" />
            <div class="min-w-0">
              <p class="text-xs lg:text-sm font-medium text-gray-900 dark:text-white truncate">{{ row.name }}</p>
              <p class="text-[10px] lg:text-xs text-gray-500 dark:text-gray-400 truncate">{{ row.email }}</p>
            </div>
          </div>
        </ng-template>

        <!-- Date column -->
        <ng-template appCellTemplate="date" let-row>
          <span class="text-xs text-gray-400">{{ row.date }}</span>
        </ng-template>

      </app-data-table>
    </div>

    <!-- Stats Sidebar -->
    <div>
      <app-contacts-panel />
    </div>
  </div>
</div>

<!-- Bottom spacer for mobile dock -->
<div class="h-20 lg:hidden"></div>
