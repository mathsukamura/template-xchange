<div class="space-y-4 lg:space-y-6">
  <!-- Page Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl lg:text-2xl font-bold text-gray-900 dark:text-white">Contatos</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1 hidden lg:block">Gerencie seus contatos e listas</p>
    </div>
    <button class="px-3 lg:px-4 py-2 bg-lime-accent text-dark text-xs lg:text-sm font-semibold rounded-lg hover:bg-lime-accent-hover transition-colors cursor-pointer">
      Adicionar contato
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 lg:gap-6">
    <!-- Contact List -->
    <div class="lg:col-span-2">
      <div class="bg-white dark:bg-dark-lighter rounded-xl border border-gray-border dark:border-dark-lighter overflow-hidden">
        <!-- Search Bar -->
        <div class="p-3 lg:p-4 border-b border-gray-border dark:border-dark-card">
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
            </svg>
            <input type="text" placeholder="Buscar contatos..." class="w-full pl-9 pr-4 py-2 bg-gray-bg dark:bg-dark-card dark:text-gray-200 rounded-lg text-sm border border-gray-border dark:border-dark-card focus:outline-none focus:ring-2 focus:ring-lime-accent/30 focus:border-lime-accent"/>
          </div>
        </div>

        <!-- Contact Rows -->
        @for (contact of recentContacts; track contact.email) {
          <div class="flex items-center gap-3 lg:gap-4 p-3 lg:p-4 hover:bg-gray-50 dark:hover:bg-dark-card transition-colors border-b border-gray-border dark:border-dark-card last:border-b-0">
            <div class="w-8 h-8 lg:w-10 lg:h-10 bg-dark dark:bg-dark-card rounded-full flex items-center justify-center text-white text-[10px] lg:text-xs font-semibold flex-shrink-0">
              {{ contact.avatar }}
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs lg:text-sm font-medium text-gray-900 dark:text-white truncate">{{ contact.name }}</p>
              <p class="text-[10px] lg:text-xs text-gray-500 dark:text-gray-400 truncate">{{ contact.email }}</p>
            </div>
            <div class="text-right flex-shrink-0 hidden sm:block">
              <p class="text-xs text-gray-400">{{ contact.date }}</p>
            </div>
            <button class="p-1.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-dark-card rounded transition-colors cursor-pointer">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
              </svg>
            </button>
          </div>
        }
      </div>
    </div>

    <!-- Stats Sidebar -->
    <div>
      <app-contacts-panel />
    </div>
  </div>
</div>

<!-- Bottom spacer for mobile dock -->
<div class="h-20 lg:hidden"></div>
