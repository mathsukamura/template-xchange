<app-page-header title="Transacoes" subtitle="Historico de vendas e pagamentos">
  <div class="flex items-center gap-3">
    <app-search-input placeholder="Buscar transacao..." />
    <button class="px-4 py-2 bg-lime-accent text-dark text-sm font-semibold rounded-xl hover:bg-lime-accent-hover transition-colors cursor-pointer whitespace-nowrap">
      Exportar
    </button>
  </div>
</app-page-header>

<app-data-table [columns]="columns" [data]="rows" [pageSize]="8">
  <!-- Cliente column -->
  <ng-template appCellTemplate="name" let-row>
    <div class="flex items-center gap-2 lg:gap-3">
      <app-avatar [initials]="row.initials" size="sm" shape="circle" variant="default" />
      <div>
        <p class="text-xs font-semibold text-gray-900 dark:text-white">{{ row.name }}</p>
        <p class="hidden lg:block text-[10px] text-gray-400">{{ row.email }}</p>
      </div>
    </div>
  </ng-template>

  <!-- ID column -->
  <ng-template appCellTemplate="id" let-row>
    <span class="text-xs font-medium text-gray-500 dark:text-gray-400">{{ row.id }}</span>
  </ng-template>

  <!-- Valor column -->
  <ng-template appCellTemplate="value" let-row>
    <span class="text-xs font-bold text-gray-900 dark:text-white">{{ row.value }}</span>
  </ng-template>

  <!-- Date column -->
  <ng-template appCellTemplate="date" let-row>
    <span class="text-xs text-gray-500 dark:text-gray-400">{{ row.date }}</span>
  </ng-template>

  <!-- Status column -->
  <ng-template appCellTemplate="status" let-row>
    <span class="text-[10px] font-semibold px-2.5 py-1 rounded-full" [class]="getStatusClasses(row.status)">
      {{ row.status }}
    </span>
  </ng-template>

  <!-- Action column -->
  <ng-template appCellTemplate="action" let-row>
    <button class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
      </svg>
    </button>
  </ng-template>
</app-data-table>

<!-- Mobile dock spacer -->
<div class="h-20 lg:hidden"></div>
