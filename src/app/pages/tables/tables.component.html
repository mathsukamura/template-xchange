<!-- Header -->
<div class="flex items-center justify-between mb-5">
  <div>
    <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white">Transacoes</h1>
    <p class="text-xs text-gray-400 mt-1">Historico de vendas e pagamentos</p>
  </div>
  <div class="flex items-center gap-3">
    <div class="relative">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
      </svg>
      <input type="text" placeholder="Buscar..." class="pl-9 pr-4 py-2 text-sm bg-white dark:bg-dark-lighter dark:text-gray-200 rounded-xl border border-gray-border dark:border-dark-lighter focus:outline-none focus:ring-2 focus:ring-lime-accent/30 w-52"/>
    </div>
    <button class="px-4 py-2 bg-lime-accent text-dark text-sm font-semibold rounded-xl hover:bg-lime-accent-hover transition-colors cursor-pointer">
      Exportar
    </button>
  </div>
</div>

<!-- Table -->
<div class="bg-white dark:bg-dark-lighter rounded-2xl overflow-hidden min-w-0">
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead>
        <tr class="border-b border-gray-100 dark:border-dark-card">
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">ID</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Cliente</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Produto</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Valor</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Data</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Status</th>
          <th class="text-left text-[10px] text-gray-400 uppercase tracking-wider font-semibold px-5 py-3">Acao</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows; track row.id) {
          <tr class="border-b border-gray-50 dark:border-dark-card last:border-b-0 hover:bg-gray-50/50 dark:hover:bg-dark-card/50 transition-colors">
            <td class="px-5 py-3">
              <span class="text-xs font-medium text-gray-500 dark:text-gray-400">{{ row.id }}</span>
            </td>
            <td class="px-5 py-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-dark dark:bg-dark-card flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0">
                  {{ row.initials }}
                </div>
                <div>
                  <p class="text-xs font-semibold text-gray-900 dark:text-white">{{ row.name }}</p>
                  <p class="text-[10px] text-gray-400">{{ row.email }}</p>
                </div>
              </div>
            </td>
            <td class="px-5 py-3">
              <span class="text-xs text-gray-700 dark:text-gray-300">{{ row.product }}</span>
            </td>
            <td class="px-5 py-3">
              <span class="text-xs font-bold text-gray-900 dark:text-white">{{ row.value }}</span>
            </td>
            <td class="px-5 py-3">
              <span class="text-xs text-gray-500 dark:text-gray-400">{{ row.date }}</span>
            </td>
            <td class="px-5 py-3">
              <span class="text-[10px] font-semibold px-2.5 py-1 rounded-full" [class]="getStatusClasses(row.status)">
                {{ row.status }}
              </span>
            </td>
            <td class="px-5 py-3">
              <button class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM12.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0zM18.75 12a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/>
                </svg>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="px-5 py-3 border-t border-gray-100 dark:border-dark-card flex items-center justify-between">
    <p class="text-xs text-gray-400">Mostrando 1-8 de 24 resultados</p>
    <div class="flex items-center gap-1">
      <button class="w-8 h-8 rounded-lg text-xs text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer flex items-center justify-center">←</button>
      <button class="w-8 h-8 rounded-lg text-xs bg-dark dark:bg-lime-accent text-white dark:text-dark flex items-center justify-center">1</button>
      <button class="w-8 h-8 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer flex items-center justify-center">2</button>
      <button class="w-8 h-8 rounded-lg text-xs text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer flex items-center justify-center">3</button>
      <button class="w-8 h-8 rounded-lg text-xs text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-card transition-colors cursor-pointer flex items-center justify-center">→</button>
    </div>
  </div>
</div>
