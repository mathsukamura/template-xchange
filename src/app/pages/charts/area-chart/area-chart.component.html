<div class="mb-6">
  <h1 class="text-2xl font-extrabold text-gray-900">Gráfico de Área</h1>
  <p class="text-xs text-gray-400 mt-1">Visualizações com preenchimento gradiente</p>
</div>

<div class="grid grid-cols-1 gap-5">
  <div class="bg-white rounded-2xl p-5">
    <p class="text-sm font-semibold text-gray-900 mb-1">Receita vs Custos</p>
    <p class="text-[10px] text-gray-400 mb-4">Evolução mensal comparativa</p>
    <apx-chart [series]="series1" [chart]="chart1" [stroke]="stroke" [fill]="fill" [colors]="colors" [xaxis]="months" [yaxis]="yaxis" [grid]="grid" [tooltip]="tooltip" [dataLabels]="dataLabels" [legend]="legend" />
  </div>

  <div class="bg-white rounded-2xl p-5">
    <p class="text-sm font-semibold text-gray-900 mb-1">Funil de Conversão (empilhado)</p>
    <p class="text-[10px] text-gray-400 mb-4">Visitantes → Leads → Clientes</p>
    <apx-chart [series]="series2" [chart]="chart2" [stroke]="stroke" [fill]="fill" [colors]="colors" [xaxis]="months" [yaxis]="yaxis" [grid]="grid" [tooltip]="tooltip" [dataLabels]="dataLabels" [legend]="legend" />
  </div>
</div>
