<div class="mb-4 lg:mb-6">
  <h1 class="text-xl lg:text-2xl font-extrabold text-gray-900 dark:text-white">Grafico de Barras</h1>
  <p class="text-xs text-gray-400 mt-1">Comparacoes por categoria e periodo</p>
</div>

<div class="grid grid-cols-1 gap-4 lg:gap-5">
  <div class="bg-white dark:bg-dark-lighter rounded-2xl p-4 lg:p-5 overflow-x-auto">
    <p class="text-sm font-semibold text-gray-900 dark:text-white mb-1">Vendas vs Reembolsos</p>
    <p class="text-[10px] text-gray-400 mb-4">Volume mensal</p>
    <div class="min-w-[600px]">
      <apx-chart [series]="series1" [chart]="chart1" [plotOptions]="plotOptions" [colors]="colors" [xaxis]="months" [yaxis]="yaxis" [grid]="grid" [tooltip]="tooltip" [dataLabels]="dataLabels" [legend]="legend" />
    </div>
  </div>

  <div class="bg-white dark:bg-dark-lighter rounded-2xl p-4 lg:p-5 overflow-x-auto">
    <p class="text-sm font-semibold text-gray-900 dark:text-white mb-1">Receita por Etapa do Funil (empilhado)</p>
    <p class="text-[10px] text-gray-400 mb-4">Atrair → Preparar → Vender</p>
    <div class="min-w-[600px]">
      <apx-chart [series]="series2" [chart]="chart2" [plotOptions]="plotOptions2" [colors]="colors" [xaxis]="months" [yaxis]="yaxis" [grid]="grid" [tooltip]="tooltip" [dataLabels]="dataLabels" [legend]="legend" />
    </div>
  </div>
</div>

<div class="h-20 lg:hidden"></div>
