<div class="min-h-screen flex bg-gray-bg dark:bg-dark">

  <!-- Left: Form -->
  <div class="flex-1 flex items-center justify-center px-8">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="flex items-center gap-3 mb-10">
        <div class="w-11 h-11 bg-lime-accent rounded-2xl flex items-center justify-center shadow-sm">
          <svg class="w-6 h-6 text-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
            <path d="M4 4l16 16M20 4L4 20"/>
          </svg>
        </div>
        <span class="text-gray-900 dark:text-white font-bold text-xl">xchange</span>
      </div>

      <!-- Heading -->
      <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">Bem-vindo de volta</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Entre na sua conta para continuar</p>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="seu@email.com"
            class="w-full px-4 py-3.5 bg-white dark:bg-dark-lighter rounded-xl text-sm text-gray-900 dark:text-white border border-gray-border dark:border-dark-lighter focus:outline-none focus:ring-2 focus:ring-lime-accent/30 focus:border-lime-accent placeholder:text-gray-400 transition-all"
          />
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">Senha</label>
            <a class="text-xs font-medium text-lime-accent hover:text-lime-accent-hover cursor-pointer transition-colors">Esqueceu?</a>
          </div>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              class="w-full px-4 py-3.5 pr-12 bg-white dark:bg-dark-lighter rounded-xl text-sm text-gray-900 dark:text-white border border-gray-border dark:border-dark-lighter focus:outline-none focus:ring-2 focus:ring-lime-accent/30 focus:border-lime-accent placeholder:text-gray-400 transition-all"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors cursor-pointer"
            >
              @if (showPassword) {
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
                </svg>
              } @else {
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full py-3.5 bg-lime-accent text-dark text-sm font-bold rounded-xl hover:bg-lime-accent-hover transition-colors cursor-pointer shadow-sm"
        >
          Entrar
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-gray-border dark:bg-dark-lighter"></div>
        <span class="text-xs text-gray-400">ou continue com</span>
        <div class="flex-1 h-px bg-gray-border dark:bg-dark-lighter"></div>
      </div>

      <!-- Social -->
      <div class="grid grid-cols-2 gap-3">
        <button class="flex items-center justify-center gap-2 py-3 bg-white dark:bg-dark-lighter rounded-xl border border-gray-border dark:border-dark-lighter hover:bg-gray-50 dark:hover:bg-dark-card transition-colors cursor-pointer">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Google</span>
        </button>
        <button class="flex items-center justify-center gap-2 py-3 bg-white dark:bg-dark-lighter rounded-xl border border-gray-border dark:border-dark-lighter hover:bg-gray-50 dark:hover:bg-dark-card transition-colors cursor-pointer">
          <svg class="w-5 h-5 text-gray-900 dark:text-white" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span class="text-sm font-medium text-gray-700 dark:text-gray-300">GitHub</span>
        </button>
      </div>

      <!-- Sign up link -->
      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-8">
        Nao tem uma conta?
        <a routerLink="/signup" class="text-lime-accent font-semibold hover:text-lime-accent-hover cursor-pointer transition-colors">Criar conta</a>
      </p>
    </div>
  </div>

  <!-- Right: Visual Panel -->
  <div class="hidden lg:flex flex-1 items-center justify-center bg-dark dark:bg-dark-card rounded-l-[3rem] relative overflow-hidden">
    <!-- Decorative elements -->
    <div class="absolute inset-0">
      <div class="absolute top-20 right-20 w-72 h-72 bg-lime-accent/10 rounded-full blur-3xl"></div>
      <div class="absolute bottom-20 left-20 w-96 h-96 bg-lime-accent/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 text-center px-12 max-w-lg">
      <!-- Illustration placeholder -->
      <div class="w-32 h-32 bg-lime-accent/20 rounded-3xl flex items-center justify-center mx-auto mb-8">
        <svg class="w-16 h-16 text-lime-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
        </svg>
      </div>
      <h2 class="text-2xl font-extrabold text-white mb-3">Gerencie seus funis com inteligencia</h2>
      <p class="text-sm text-gray-400 leading-relaxed">Acompanhe conversoes, automatize processos e escale suas vendas com a plataforma mais completa do mercado.</p>

      <!-- Dots indicator -->
      <div class="flex items-center justify-center gap-2 mt-8">
        <div class="w-8 h-2 bg-lime-accent rounded-full"></div>
        <div class="w-2 h-2 bg-gray-600 rounded-full"></div>
        <div class="w-2 h-2 bg-gray-600 rounded-full"></div>
      </div>
    </div>
  </div>
</div>
