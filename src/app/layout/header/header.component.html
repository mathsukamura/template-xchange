<header class="flex items-center justify-between gap-3">
  <!-- Left: Floating Tab Menu -->
  <div class="hidden lg:flex bg-white dark:bg-dark-card rounded-full p-1 items-center gap-0.5 shadow-sm overflow-x-auto flex-shrink min-w-0 scrollbar-hide">
    @for (tab of tabs; track tab.route) {
      <a
        [routerLink]="tab.route"
        routerLinkActive="!bg-dark dark:!bg-lime-accent !text-white dark:!text-dark"
        class="px-3 lg:px-5 py-2 text-xs lg:text-sm font-medium text-gray-500 dark:text-gray-400 rounded-full transition-all hover:text-gray-700 dark:hover:text-gray-200 cursor-pointer whitespace-nowrap"
      >
        {{ tab.label }}
      </a>
    }
  </div>

  <!-- Right: Progress Bar, Notifications, Profile -->
  <div class="flex items-center gap-2 lg:gap-4 flex-shrink-0 ml-auto">
    <!-- Progress Bar (hidden on mobile) -->
    <div class="hidden md:flex items-center gap-2.5">
      <div class="w-28 h-2.5 bg-gray-200 dark:bg-dark-lighter rounded-full overflow-hidden">
        <div
          class="h-full bg-lime-accent rounded-full transition-all duration-500"
          [style.width.%]="progress"
        ></div>
      </div>
      <span class="text-xs font-semibold text-gray-600 dark:text-gray-400">{{ progress }}%</span>
    </div>

    <!-- Dark Mode Toggle -->
    <button
      (click)="theme.toggle()"
      class="relative w-9 h-9 lg:w-10 lg:h-10 rounded-2xl bg-white dark:bg-dark-card flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-lighter hover:text-gray-700 dark:hover:text-white transition-colors cursor-pointer shadow-sm"
    >
      @if (theme.isDark()) {
        <svg class="w-4 h-4 lg:w-5 lg:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/>
        </svg>
      } @else {
        <svg class="w-4 h-4 lg:w-5 lg:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
        </svg>
      }
    </button>

    <!-- Notifications -->
    <button class="relative w-9 h-9 lg:w-10 lg:h-10 rounded-2xl bg-white dark:bg-dark-card flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-dark-lighter hover:text-gray-700 dark:hover:text-white transition-colors cursor-pointer shadow-sm">
      <svg class="w-4 h-4 lg:w-5 lg:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
      </svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-lime-accent rounded-full"></span>
    </button>

    <!-- User Avatar -->
    <button class="w-9 h-9 lg:w-10 lg:h-10 rounded-2xl overflow-hidden bg-dark dark:bg-dark-lighter flex items-center justify-center cursor-pointer hover:ring-2 hover:ring-lime-accent/40 transition-all shadow-sm">
      <span class="text-white text-xs lg:text-sm font-semibold">DR</span>
    </button>
  </div>
</header>
