<header class="flex items-center justify-between">
  <!-- Left: Floating Tab Menu -->
  <div class="bg-white rounded-full p-1 flex items-center gap-0.5 shadow-sm">
    @for (tab of tabs; track tab.route) {
      <a
        [routerLink]="tab.route"
        routerLinkActive="!bg-dark !text-white"
        class="px-5 py-2 text-sm font-medium text-gray-500 rounded-full transition-all hover:text-gray-700 cursor-pointer"
      >
        {{ tab.label }}
      </a>
    }
  </div>

  <!-- Right: Progress Bar, Notifications, Profile -->
  <div class="flex items-center gap-4">
    <!-- Progress Bar -->
    <div class="flex items-center gap-2.5">
      <div class="w-28 h-2.5 bg-gray-200 rounded-full overflow-hidden">
        <div
          class="h-full bg-lime-accent rounded-full transition-all duration-500"
          [style.width.%]="progress"
        ></div>
      </div>
      <span class="text-xs font-semibold text-gray-600">{{ progress }}%</span>
    </div>

    <!-- Notifications -->
    <button class="relative w-10 h-10 rounded-2xl bg-white flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors cursor-pointer shadow-sm">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
      </svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-lime-accent rounded-full"></span>
    </button>

    <!-- User Avatar -->
    <button class="w-10 h-10 rounded-2xl overflow-hidden bg-dark flex items-center justify-center cursor-pointer hover:ring-2 hover:ring-lime-accent/40 transition-all shadow-sm">
      <span class="text-white text-sm font-semibold">DR</span>
    </button>
  </div>
</header>
