<div class="min-h-screen bg-gray-bg dark:bg-dark flex flex-col lg:flex-row">
  <!-- Sidebar -->
  <app-sidebar (expandedChange)="onSidebarExpand($event)" />

  <!-- Main Content Area -->
  <div
    class="flex-1 min-w-0 flex flex-col p-3 lg:p-4 gap-3 lg:gap-4 transition-all duration-300"
    [style.margin-left.px]="isMobile ? 0 : (sidebarExpanded ? 208 : 72)"
  >
    <!-- Header -->
    <app-header />

    <!-- Page Card Container -->
    <div class="bg-gray-card dark:bg-dark-card rounded-2xl lg:rounded-3xl shadow-sm flex-1 p-4 lg:p-8 overflow-auto">
      <router-outlet />
    </div>
  </div>
</div>
